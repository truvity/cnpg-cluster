# cnpg-database: Logical database within a CloudNativePG cluster
#
# Creates a Database CR (CNPG 1.28+ declarative database management).

# Database identity
databaseName: ""
clusterName: ""
namespace: ""

# Database owner (PostgreSQL role that owns this database)
owner: "app"

# RETIRED (ADR-026): allowedConsumers previously generated a
# CiliumNetworkPolicy ingress rule per entry — Cilium is gone; per-install
# NetworkPolicies live in the ring2 business charts now. Kept as a no-op
# for values compatibility.
allowedConsumers: []
