# cnpg-database: Logical database within a CloudNativePG cluster
#
# Creates a Database CR (CNPG 1.28+ declarative database management).

# Database identity
databaseName: ""
clusterName: ""
namespace: ""

# Database owner (PostgreSQL role that owns this database)
owner: "app"

# RETIRED: allowedConsumers previously generated a CiliumNetworkPolicy
# ingress rule per entry. The chart renders no network policy any more;
# the consumer owns its own NetworkPolicies. Kept as a no-op for values
# compatibility.
allowedConsumers: []
