# cnpg-cluster v2: the tier-injected PostgreSQL profile carrier.
#
# CONTRACT: this chart implements gitops docs/architecture/
# pg-usage-shapes.md — if they disagree, the doc wins and the chart is
# the bug. The PLATFORM injects `profile` and `backup` coordinates
# (wave-105 valuesObject); the PROJECT declares databases/roles/customers.
# A project cannot ship a prod posture of its own choosing.
#
# v2 breaking changes vs 1.x: IRSA removed (EKS Pod Identity binds the
# {clusterName} ServiceAccount to the platform-minted
# {env}-pg-backup-{project} role — no chart-side IAM at all);
# isWALArchiver is now true when backup is enabled; databases/roles are
# declared here (the cnpg-database chart is retired).

clusterName: ""
namespace: ""

# ── Platform-injected ────────────────────────────────────────────────
# profile: "devel" | "prod" — selects the hardened posture. stage runs
# "prod". Injected by wave-105; do not set in project values. REQUIRED:
# the render fails when unset/invalid — a misspelled profile must never
# silently degrade prod to a single-instance devel posture.
profile: ""

# Tenancy labels stamped on the Cluster CR; the operator's
# INHERITED_LABELS fans them out to Pods/PVCs/Services (gitops INF-476).
labels: {}
#  tenancy.truvity.io/project: url-shortener
#  tenancy.truvity.io/tier: primary

# Backup coordinates (platform-injected; the gitops repo derives them
# from cfg/gen/{backup-scope}/ via cfg/config-cnpg). Empty bucket = archiving
# off (devel default — only the designated test project archives there).
backup:
  enabled: false
  bucketName: ""
  # s3Prefix defaults to {namespace}/{clusterName}/ when empty — the
  # permission-model write scope. Override only for recovery drills.
  s3Prefix: ""
  # serverName is the barman server directory under the prefix; defaults
  # to clusterName. A RECREATED (fresh initdb) cluster must NOT reuse
  # its predecessor's archive dir — barman's check-wal-archive refuses a
  # non-empty archive for a new timeline history. Bump a generation
  # suffix on recreate ({clusterName}-g2, -g3, …); the old dir stays
  # readable for recovery until the S3 lifecycle expires it. A
  # recovery-bootstrapped cluster CONTINUES the old dir instead.
  serverName: ""
  schedule: "0 0 2 * * *"
  # retentionDays is the FUNCTIONAL PITR window (plugin-pruned; the S3
  # lifecycle backstop is 180d, structure-side).
  retentionDays: 30
  # Separate knobs — the plugin's data enum (bzip2/gzip/lz4/snappy) is
  # narrower than WAL's (which adds xz/zstd).
  walCompression: zstd
  dataCompression: snappy
  # Server-side encryption asked for on every upload (AES256 or
  # aws:kms). Empty sends no x-amz-server-side-encryption header and
  # leaves encryption to the bucket's own policy -- required by stores
  # that reject the header (Cloudflare R2 among them).
  encryption: AES256
  # S3-COMPATIBLE STORES. Empty keeps the AWS endpoint, so nothing
  # changes for an AWS caller. The plugin has understood endpointURL all
  # along; this chart simply never passed it, which made backups AWS-only
  # by omission rather than by decision. Examples:
  #   Cloudflare R2  https://<account>.r2.cloudflarestorage.com
  #   MinIO          https://minio.example.internal:9000
  #   Ceph RGW       https://rgw.example.internal
  # A custom endpoint is addressed path-style (endpoint/bucket/key): that
  # is the S3 SDK's own default whenever endpoint_url is set, and every
  # store above accepts it, so there is no addressing switch here. No
  # region is needed either: the SDK signs with us-east-1 when none is
  # configured, which R2 aliases to its single `auto` region and MinIO
  # ignores; a store that insists on one can name it in existingSecretKeys.
  endpoint: ""
  # {name, key} of a Secret holding the PEM bundle that verifies the
  # endpoint's certificate, for a private store under its own CA. Empty
  # trusts the system roots.
  endpointCA: {}
  # Static credentials for a store with no pod identity, as
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in an existing Secret.
  # Empty keeps the pod's ambient identity (inheritFromIAMRole), which is
  # the right default on AWS: asking for keys there would be asking for
  # the thing pod identity exists to remove.
  existingSecret: ""
  # The keys read from existingSecret. sessionToken and region are read
  # only when NAMED -- the plugin refuses a missing key rather than
  # skipping it -- so leave them empty for the usual static key pair.
  existingSecretKeys:
    accessKeyId: AWS_ACCESS_KEY_ID
    secretAccessKey: AWS_SECRET_ACCESS_KEY
    sessionToken: ""
    region: ""

# ── Project-declared ─────────────────────────────────────────────────
# The bootstrap database + owner. The owner is a TECHNICAL role: used
# only by the migration job (DDL), never interactive. CNPG initdb also
# mints the {clusterName}-app basic-auth Secret for the owner — the
# `auth: password` compatibility path.
bootstrap:
  mode: initdb # or "recovery"
  initdb:
    database: ""
    owner: ""
    # Declarative schemas on the bootstrap database (renders its
    # Database CR). A STATIC project property — install tooling passes
    # only the name-derived scalars above.
    schemas: []
  recovery:
    source:
      bucketName: ""
      s3Prefix: ""
      serverName: ""
      # The archive being recovered from may live on a different store
      # than the one this cluster will back up to (a drill from R2 into
      # a cluster that archives to AWS, say), so the store coordinates
      # are repeated here with the same meaning as under `backup`.
      endpoint: ""
      endpointCA: {}
      existingSecret: ""
      existingSecretKeys:
        accessKeyId: AWS_ACCESS_KEY_ID
        secretAccessKey: AWS_SECRET_ACCESS_KEY
        sessionToken: ""
        region: ""
    target:
      targetTime: ""
      exclusive: false

# Additional databases in this cluster (absorbs the retired
# cnpg-database chart): name/owner/schemas/ensure.
databases: []
#  - name: app
#    owner: us-owner
#    schemas: [urls, stats]

# Customers (shared-cluster, database-per-customer shape — rung 2 of the
# isolation ladder): each renders a Database owned by the shared owner
# plus a {name}-access NOLOGIN role the daemon role joins. One daemon
# cert, N databases; shared PITR timeline (see pg-usage-shapes.md).
customers: []
#  - name: customer-a

# Roles (DatabaseRole CRs). auth: cert → operator-issued mTLS client
# certificate in Secret {name}-client-cert (the terminal state for
# applications). auth: password → the compatibility escape hatch:
#   * the bootstrap owner needs no entry here — CNPG's initdb already
#     mints the {clusterName}-app basic-auth Secret for it;
#   * any OTHER password role MUST bring its own passwordSecret (a
#     kubernetes.io/basic-auth Secret, e.g. ESO-delivered or created by
#     the verify suite) — the chart NEVER generates passwords
#     (template-time randomness drifts under ArgoCD; see the
#     url-shortener-infra history).
roles: []
#  - name: us-app
#    auth: cert
#    inRoles: []
#  - name: us-legacy
#    auth: password
#    passwordSecret: us-legacy-pg-credentials

# ── Overridable knobs (profile provides defaults) ────────────────────
instances: null          # devel 1 / prod 3 unless overridden
storage:
  size: ""               # profile default: devel 2Gi / prod 10Gi
  storageClass: ""       # devel cnpg-gp3-delete / prod cnpg-gp3
walStorage:
  size: "5Gi"            # prod only; devel skips the WAL volume

# Empty = profile default: prod 250m/512Mi req + 1Gi mem limit;
# devel 100m/256Mi req + 512Mi mem limit (with shared_buffers 64MB —
# devel databases are tiny). A set value replaces the default wholesale.
resources: {}

postgresql:
  parameters: {}
  extra_pg_hba: []       # appended AFTER the profile posture lines

enableSuperuserAccess: false

# ── Server certificate (optional) ────────────────────────────────────
# By default the operator mints a self-signed CA per cluster and signs
# the server certificate from it. Setting serverTLS.issuerRef.name makes
# the chart request the SERVER certificate from a cert-manager issuer
# instead, for every Service of the cluster
# ({clusterName}-{rw,ro,r}.{namespace}.svc.cluster.local), and point
# spec.certificates.serverTLSSecret / serverCASecret at it.
#
# SERVER TLS ONLY. The client CA stays the operator's ({clusterName}-ca),
# so the replication certificate, DatabaseRole client certificates and
# pg_hba are unchanged. What changes is what a client that VERIFIES the
# server (sslmode=verify-ca / verify-full) must trust -- the issuer's
# roots, not {clusterName}-ca -- and, under verify-full, the host it may
# dial: only the fully-qualified names above are in the certificate.
# Move such clients before setting this.
serverTLS:
  # {name, kind, group} of the cert-manager issuer. Empty name = the
  # operator's own CA (default).
  issuerRef: {}
  # Passed to the Certificate when set; cert-manager's defaults otherwise.
  duration: ""
  renewBefore: ""
  # Passed through, e.g. {algorithm: ECDSA, size: 384}. An issuer that
  # signs one key type only (most Vault/OpenBAO roles) refuses any other.
  privateKey: {}
  # REQUIRED with issuerRef: the PEM roots that verify the issued chain.
  # It becomes the server CA Secret's ca.crt -- what the operator's status
  # client, replicas and poolers verify the server with. The issued
  # Secret's own ca.crt is not enough: an issuer below an intermediate
  # puts the intermediate there, and libpq will not accept a trust anchor
  # that is not self-signed.
  caCertificates: ""

# The tainted Karpenter pool CNPG instances land on (nodeSelector +
# matching toleration). An EXPLICIT value pins BOTH profiles; unset
# (~), the prod profile defaults to "database" and devel rides the
# default pools — the pre-1.1.0 behavior. Empty string opts out
# anywhere — the escape hatch for installs on clusters without a
# dedicated pool.
scheduling:
  databasePool: ~
